version: "3.9"

services:
  rag-bot:
    build: .
    container_name: rag-bot
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: